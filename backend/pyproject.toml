[project]
name = "nexa-backend"
version = "1.0.0"
description = "Nexa Commerce — premium Telegram digital-goods store: API, bot and workers"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic[email]>=2.7",
  "pydantic-settings>=2.3",
  "redis>=5.0,<6",
  "arq>=0.26",
  "aiogram>=3.31",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "cryptography>=42",
  "structlog>=24.1",
  "httpx>=0.27",
  "qrcode[pil]>=7.4",
  "pillow>=10.3",
  "typer>=0.12",
  "python-multipart>=0.0.9",
  "orjson>=3.10",
  "aiosmtplib>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008", "ASYNC240", "UP042", "B904"]
